name: Finalize Week (Auto)

# Runs Wednesday at 07:00 UTC — safely after MNF ends (~01:00 UTC Tuesday).
# Finalizes all active leagues for the week that just completed
# and awards Power Restore Chips to weekly high scorers.
on:
  schedule:
    - cron: "0 7 * * 3"
  workflow_dispatch: {}   # allow manual trigger for testing

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger finalize-week cron route
        # --fail-with-body: non-200 fails the step AND prints the response body.
        # HISTORY NOTE (2026-07-22): this file was invalid YAML from June until
        # today — the old curl -w flag contained a literal quoted newline that
        # terminated the YAML block, so the Wednesday schedule NEVER fired; all
        # 79 historical "runs" were push-time parse failures. Discovered while
        # verifying the audit-fix deploy.
        run: |
          curl -sS --fail-with-body -X POST "${{ secrets.NEXT_PUBLIC_APP_URL }}/api/cron/finalize-week" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" -H "Content-Type: application/json"
