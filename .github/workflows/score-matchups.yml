name: Score Matchups (Live)

# Runs every 15 min, every day. The route decides whether there is anything to
# score; this schedule no longer tries to.
#
# It used to skip Wednesday (DOW mask 0,1,2,4,5,6) because Wednesday has no NFL
# games. That guarded the calendar, not the scheduler: GitHub delays scheduled
# runs, and on 2026-09-23 the tick scheduled for Tuesday 23:45 UTC executed at
# 00:25 UTC Wednesday — past the 00:00 UTC week rollover — so it scored the NEW
# week, two days before its first kickoff, and wrote phantom points onto an
# unplayed board (OPEN-LOOPS #54). A day mask cannot prevent that; only checking
# the schedule can.
#
# /api/cron/score-matchups now skips unless a game in the target week has kicked
# off, so the extra Wednesday ticks cost one cheap query each and nothing else —
# and a week that ever does open on a Wednesday gets scored live instead of
# waiting until Thursday.
on:
  schedule:
    - cron: "0,15,30,45 * * * *"
  workflow_dispatch: {}   # allow manual trigger for testing

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger score-matchups cron route
        # --fail-with-body: non-200 fails the step AND prints the response body,
        # so a broken edge function shows up as a red run with the actual error
        # (previously the body was discarded and failures stayed green)
        run: |
          curl -sS --fail-with-body -X POST             "${{ secrets.NEXT_PUBLIC_APP_URL }}/api/cron/score-matchups"             -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"             -H "Content-Type: application/json"
