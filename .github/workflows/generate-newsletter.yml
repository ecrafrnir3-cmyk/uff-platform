name: Generate Weekly Newsletter (Auto)

# Runs Wednesday at 07:30 UTC — 30 minutes after finalize-week (07:00 UTC).
# Generates AI-powered weekly newsletter for all active leagues.
# Fires after finalize so all matchups are marked complete and records are settled.
on:
  schedule:
    - cron: "30 7 * * 3"
  workflow_dispatch:      # manual trigger — also how a week is repaired
    inputs:
      week:
        description: "Week to generate (blank = the week just finalized)"
        required: false
        default: ""
      force:
        description: "Regenerate even if that week already exists (1 = yes)"
        required: false
        default: ""
      no_email:
        description: "Write it but do NOT email the league (1 = yes)"
        required: false
        default: ""
      email_only:
        description: "Email the ALREADY STORED newsletter, no regeneration (1 = yes)"
        required: false
        default: ""

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate weekly newsletter
        run: |
          # Query string from the dispatch inputs. The scheduled run passes none,
          # so its URL stays byte-identical to what it has always sent.
          Q=""
          [ -n "${{ github.event.inputs.week }}" ]     && Q="${Q}&week=${{ github.event.inputs.week }}"
          [ -n "${{ github.event.inputs.force }}" ]    && Q="${Q}&force=${{ github.event.inputs.force }}"
          [ -n "${{ github.event.inputs.no_email }}" ] && Q="${Q}&noEmail=${{ github.event.inputs.no_email }}"
          [ -n "${{ github.event.inputs.email_only }}" ] && Q="${Q}&emailOnly=${{ github.event.inputs.email_only }}"
          [ -n "$Q" ] && Q="?${Q#&}"
          echo "query: ${Q:-<none>}"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.NEXT_PUBLIC_APP_URL }}/api/cron/generate-newsletter${Q}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          BODY=$(echo "$RESPONSE" | head -n -1)
          STATUS=$(echo "$RESPONSE" | tail -n 1)
          echo "Response body: $BODY"
          echo "Response status: $STATUS"
          # 200 = all ok, 207 = partial success (some leagues failed) — both acceptable
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "207" ]; then
            echo "Unexpected status $STATUS"
            exit 1
          fi
